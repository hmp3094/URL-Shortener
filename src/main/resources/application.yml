server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: url-shortener
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${SPRING_DATASOURCE_USERNAME:urlshortener}
    password: ${SPRING_DATASOURCE_PASSWORD:urlshortener}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  rate-limit:
    capacity: ${APP_RATE_LIMIT_CAPACITY:20}
    refill-tokens: ${APP_RATE_LIMIT_REFILL_TOKENS:20}
    refill-period-seconds: ${APP_RATE_LIMIT_REFILL_PERIOD_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
